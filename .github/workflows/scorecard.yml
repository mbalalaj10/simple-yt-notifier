# Simple YT Notifier - Security Scorecard workflow for running security checks on the repository
# Created on April 9th, 2026

name: Security Scorecard Action

on:
  workflow_dispatch:
  branch_protection_rule:
    types: [created, edited, deleted]
  schedule:
    # Runs every Saturday at 04:00 UTC
    - cron: "0 4 * * 6" 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    # Standard safeguard to prevent duplicate runs on PRs and pushes
    if: github.event.repository.default_branch == github.ref_name || github.event_name == 'pull_request'
    
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run Analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: SARIF File
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          sarif_file: results.sarif